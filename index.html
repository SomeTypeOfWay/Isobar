<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isobar Weather</title>
<meta name="description" content="Free weather forecasts from Open-Meteo with NWS alerts.">
<meta name="theme-color" content="#edf1f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Isobar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700&family=Public+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Data: Open-Meteo forecast + air quality + marine (swell), NWS alerts for US places.
   Layout: one phone screen, no page scroll. Top bar, a now-card with 3D animated type and the 5x2 metric grid, the 3D field takes the leftover height, an Hours/Days strip; detail lives in a bottom sheet */
:root{
  --bg:#edf1f3;--surface:#ffffff;--surface-2:#f4f7f8;--ink:#13202a;--muted:#55656f;--line:#d5dde2;
  --accent:#1d6b95;--cool:#4b8fc0;--warm:#d0702c;--mid:#b9c7cf;--wind:#2f8a78;--sea:#0f7f8c;
  --danger-bg:#fbe3df;--danger-ink:#8f2417;--warn-bg:#fbefd2;--warn-ink:#7a4d05;--info-bg:#dfedf6;--info-ink:#174a6b;
  --good:#2f7d3b;--fair:#9a7a06;--bad:#b04317;--scrim:rgba(19,32,42,.18);
  --mood-clear:#fbe6b0;--mood-night:#d8ddef;--mood-cloud:#dde5ea;--mood-rain:#cddfee;--mood-snow:#e8eff6;--mood-storm:#dcd4ef;
  --mood:var(--mood-cloud);--storm:#7a5cc4;--shade:#0b141a;--tone:var(--mid);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1317;--surface:#141c21;--surface-2:#1a242a;--ink:#e5ecf0;--muted:#93a2ab;--line:#28343b;
  --accent:#7ec3e8;--cool:#6aa9d6;--warm:#eb945a;--mid:#5d6c75;--wind:#6cc7b2;--sea:#5fc9d4;
  --danger-bg:#3d1712;--danger-ink:#ffb4a6;--warn-bg:#3a2a08;--warn-ink:#f6cf78;--info-bg:#112b3c;--info-ink:#a6d4f0;
  --good:#7fcf8a;--fair:#e5c54e;--bad:#f2905f;--scrim:rgba(0,0,0,.4);
  --mood-clear:#3a2f14;--mood-night:#1a2036;--mood-cloud:#202a30;--mood-rain:#13283a;--mood-snow:#253240;--mood-storm:#28203e;--storm:#a58cf0;--shade:#000;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1317;--surface:#141c21;--surface-2:#1a242a;--ink:#e5ecf0;--muted:#93a2ab;--line:#28343b;
  --accent:#7ec3e8;--cool:#6aa9d6;--warm:#eb945a;--mid:#5d6c75;--wind:#6cc7b2;--sea:#5fc9d4;
  --danger-bg:#3d1712;--danger-ink:#ffb4a6;--warn-bg:#3a2a08;--warn-ink:#f6cf78;--info-bg:#112b3c;--info-ink:#a6d4f0;
  --good:#7fcf8a;--fair:#e5c54e;--bad:#f2905f;--scrim:rgba(0,0,0,.4);
  --mood-clear:#3a2f14;--mood-night:#1a2036;--mood-cloud:#202a30;--mood-rain:#13283a;--mood-snow:#253240;--mood-storm:#28203e;--storm:#a58cf0;--shade:#000;
  color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sr{position:absolute;left:-9999px}

/* the app is exactly one screen tall; on very short screens (landscape) it scrolls instead of squashing */
.app{height:100%;min-height:520px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0;position:relative}
.cell.pop{animation:pop .5s ease}
@keyframes pop{0%{box-shadow:0 0 0 0 var(--accent)}35%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}

/* top bar */
.bar{display:flex;align-items:center;gap:6px;height:38px;flex:none}
.city{display:flex;align-items:center;gap:6px;min-width:0;border:0;background:none;padding:0 2px;height:38px}
.city b{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.city svg{width:14px;height:14px;flex:none;color:var(--muted)}
.pill{flex:none;border:0;border-radius:999px;font-size:11.5px;font-weight:600;padding:3px 9px}
.pill.alert{background:var(--danger-bg);color:var(--danger-ink)}
.pill.sample{background:var(--warn-bg);color:var(--warn-ink)}
.grow{flex:1}
.ibtn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.ibtn svg{width:17px;height:17px}

/* now card */
.hero{flex:none;background:var(--mood);border-color:transparent;padding:10px 14px 8px;transition:background .6s;touch-action:pan-y;-webkit-user-select:none;user-select:none;overflow:hidden;isolation:isolate;--rx:9deg;--ry:-16deg}
.hero>*{position:relative;z-index:1}
.hero>.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.hero>.fx.front{z-index:2}
.when{display:flex;align-items:center;justify-content:space-between;gap:8px;height:22px}
.when .tag{font-size:12.5px;font-weight:600}
.when button{border:1px solid var(--ink);background:none;border-radius:999px;font-size:11.5px;padding:1px 9px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px}
.cside{min-width:0;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:2px}
.hfoot{display:flex;align-items:flex-end;gap:8px;margin-top:2px}
.hinfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:0}
.lnk{cursor:pointer;text-decoration:underline dotted;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px}
button.lnk{border:0;background:none;padding:0;font:inherit;color:inherit}
.morebtn{flex:none;display:inline-flex;align-items:center;gap:3px;border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);background:color-mix(in srgb,var(--surface) 45%,transparent);border-radius:999px;font-size:11.5px;font-weight:600;padding:3px 8px 3px 11px}
.morebtn svg{width:13px;height:13px;transition:transform .3s}
.morebtn[aria-expanded="true"] svg{transform:rotate(180deg)}
/* the extra readings fold away; See more opens them */
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1)}
.more.open{grid-template-rows:1fr}
.more>.clip{min-height:0;overflow:hidden}

/* 3D type: stacked copies of the text pushed back in Z make the extrusion; the stack tilts with your finger and moves with the weather */
.t3d{perspective:520px;perspective-origin:50% 40%}
.tilt{transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.hero.touch .tilt{transition:transform .12s ease-out}
.anim,.anim>div{transform-style:preserve-3d}
.x3d{position:relative;display:block;transform-style:preserve-3d}
.x3d>span{display:block}
.x3d .ly{position:absolute;left:0;top:0;right:0;bottom:0}
.x3d .ly.deep sup{visibility:hidden}
.x3d .ly.sh{color:var(--shade)!important;opacity:.22;filter:blur(5px)}
.x3d .face{position:relative;transform:translateZ(0);color:var(--ink)}
.x3d.in{animation:x3in .42s cubic-bezier(.2,.8,.2,1)}
@keyframes x3in{from{transform:translateZ(-22px) rotateX(-18deg)}to{transform:none}}
.temp{font-family:var(--f-display);font-weight:700;font-size:clamp(78px,24vw,108px);line-height:.86;letter-spacing:-.01em;padding:4px 12px 6px 0;white-space:nowrap}
.temp sup{font-size:.4em;vertical-align:top;position:relative;top:.12em;margin-left:2px}
.cond{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,6.2vw,26px);line-height:1;letter-spacing:.01em;padding:0 4px 3px 0;max-width:100%}
.hicon{padding:0 4px 2px 0}
.x3d.ic svg{display:block;width:52px;height:52px}
.x3d.ic .ly svg,.x3d.ic .ly svg *{color:inherit!important}
.x3d.ic .ly [stroke]:not([stroke="none"]){stroke:currentColor!important}
.x3d.ic .ly [fill]:not([fill="none"]){fill:currentColor!important}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .x3d.txt .face{background:linear-gradient(105deg,transparent 38%,var(--glint,transparent) 50%,transparent 62%) 170% 0/260% 100% no-repeat,linear-gradient(var(--ink),var(--ink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero[data-fx="clear"] .x3d.txt .face,.hero[data-fx="night"] .x3d.txt .face,.hero[data-fx="snow"] .x3d.txt .face{animation:glint 5.5s ease-in-out infinite}
  .hero .cond .x3d.txt .face{animation-delay:-1.4s}
}
.hero[data-fx="clear"]{--glint:color-mix(in srgb,var(--warm) 55%,#fff)}
.hero[data-fx="night"]{--glint:color-mix(in srgb,var(--accent) 45%,#fff)}
.hero[data-fx="snow"]{--glint:#fff}
@keyframes glint{0%,50%{background-position:170% 0,0 0}100%{background-position:-70% 0,0 0}}

/* how the type moves for each kind of weather */
.hero[data-fx="clear"] .anim{animation:floaty 6s ease-in-out infinite alternate}
.hero[data-fx="night"] .anim{animation:floaty 9s ease-in-out infinite alternate}
.hero[data-fx="partly"] .anim,.hero[data-fx="cloud"] .anim{animation:drift3 8s ease-in-out infinite alternate}
.hero[data-fx="fog"] .anim{animation:drift3 12s ease-in-out infinite alternate}
.hero[data-fx="rain"] .anim{animation:bob 2.8s ease-in-out infinite}
.hero[data-fx="snow"] .anim{animation:sway 7s ease-in-out infinite alternate}
.hero[data-fx="storm"] .anim{animation:tense 3.4s ease-in-out infinite}
.hero.windy .anim{animation:gust 2.3s ease-in-out infinite alternate}
.hero.zap .anim{animation:zap .38s linear}
.hero .cside .anim{animation-delay:-1.3s}
.hero .cond .anim{animation-delay:-2.1s}
@keyframes floaty{from{transform:translateY(1px) rotateY(-5deg)}to{transform:translateY(-3px) rotateY(5deg)}}
@keyframes drift3{from{transform:rotateY(-7deg) rotateX(-2deg)}to{transform:rotateY(7deg) rotateX(2deg)}}
@keyframes bob{0%,100%{transform:rotateX(0) translateY(0)}50%{transform:rotateX(7deg) translateY(1.5px)}}
@keyframes sway{from{transform:rotateZ(-1.5deg) rotateY(-6deg)}to{transform:rotateZ(1.5deg) rotateY(6deg)}}
@keyframes tense{0%,100%{transform:rotateY(-3deg)}50%{transform:rotateY(3deg) rotateX(3deg)}}
@keyframes gust{from{transform:rotateY(-13deg) skewX(-3deg)}to{transform:rotateY(10deg) skewX(2deg)}}
@keyframes zap{0%,100%{transform:none}20%{transform:translate(-2px,1px) rotateZ(-1deg)}45%{transform:translate(2px,-1px) rotateZ(1deg)}70%{transform:translate(-1px,0)}}

/* the icon's own parts move too */
.hero .a-spin,.hero .a-rock,.hero .a-drift,.hero .a-fog{transform-box:fill-box;transform-origin:center}
.hero .a-spin{animation:spin 20s linear infinite}
.hero .a-rock{animation:rock 5s ease-in-out infinite alternate}
.hero .a-drift{animation:cdrift 4s ease-in-out infinite alternate}
.hero .a-fog{animation:fogx 3.2s ease-in-out infinite alternate}
.hero .a-fog.b{animation-direction:alternate-reverse}
.hero .a-drop{animation:drop 1.1s linear infinite}
.hero .a-flake{animation:flake 2.4s ease-in-out infinite}
.hero .d2{animation-delay:-.37s}.hero .d3{animation-delay:-.74s}
.hero .a-flake.d2{animation-delay:-.8s}.hero .a-flake.d3{animation-delay:-1.6s}
.hero .a-bolt{animation:bolt 3.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rock{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes cdrift{from{transform:translateX(-.9px)}to{transform:translateX(.9px)}}
@keyframes fogx{from{transform:translateX(-1.4px)}to{transform:translateX(1.4px)}}
@keyframes drop{0%{transform:translateY(-2.5px);opacity:0}25%{opacity:1}100%{transform:translateY(3px);opacity:0}}
@keyframes flake{0%{transform:translateY(-2px);opacity:0}30%{opacity:1}100%{transform:translateY(2.5px);opacity:0}}
@keyframes bolt{0%,58%,64%,70%,100%{opacity:1}61%,67%{opacity:.1}}
/* short screens (iPhone SE in Safari): tighter now-card so everything still fits */
@media (max-height:620px){.temp{font-size:68px}.cond{font-size:20px}.x3d.ic svg{width:42px;height:42px}#hrain{display:none}.hero .m{height:30px}.dock{margin-top:5px;padding-top:3px}}
@media (prefers-reduced-motion:reduce){.hero *,.hero .x3d.txt .face{animation:none!important}.tilt{transition:none}}
.meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--ink);font-weight:600}

/* 3D field: takes all the height left over */
.field{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;overflow:hidden}
.fhead{display:flex;align-items:center;gap:6px;padding:7px 7px 0 10px;flex:none}
.mchips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.mchips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:11.5px;padding:3px 9px}
.mchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ibtn.sm{width:30px;height:30px;border-radius:9px}
.ibtn.sm svg{width:15px;height:15px}
.stage{flex:1;min-height:0;position:relative;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.stage:active{cursor:grabbing}
.stage canvas{display:block;width:100%!important;height:100%!important}
/* readout for the selected hour, top left of the graph: small time label, big value, supporting detail */
.fread{position:absolute;left:12px;top:6px;z-index:1;max-width:calc(100% - 24px);pointer-events:none;color:var(--ink);
  text-shadow:0 0 8px var(--surface),0 0 3px var(--surface),0 0 1px var(--surface)}
.fread .when{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.fread .big{display:flex;align-items:baseline;gap:8px;margin-top:1px;white-space:nowrap}
.fread .big b{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:.95;letter-spacing:-.01em}
.fread .big b small{font-size:.48em;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:0}
.fread .big span{font-size:13.5px;font-weight:600}
.fread .sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fread .lnk{pointer-events:auto;color:inherit}

/* hours / days strip */
.strip{flex:none;padding:6px 0 6px}
.dslider{position:relative;height:40px;margin:0 16px 4px;cursor:ew-resize;touch-action:none;-webkit-user-select:none;user-select:none}
.dslider[hidden]{display:none}
.dslider .rail{position:absolute;left:0;right:0;top:3px;height:4px;border-radius:2px;background:var(--ink);opacity:.15}
.dslider .fill{position:absolute;left:0;top:3px;height:4px;border-radius:2px;background:var(--ink);opacity:.35}
.dslider .dt{position:absolute;top:0;width:1px;height:10px;background:var(--ink);opacity:.3}
.dslider .dl{position:absolute;top:14px;width:10%;transform:translateX(-50%);text-align:center;font-size:9.5px;line-height:1.15;color:var(--muted);border-radius:6px;padding:1px 0}
.dslider .dl b{display:block;font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--ink)}
.dslider .dl.sel{background:var(--ink);color:var(--bg)}
.dslider .dl.sel b{color:var(--bg)}
.dslider .dl.we b{color:var(--accent)}
.dslider .dl.sel.we b{color:var(--bg)}
.dslider .knob{position:absolute;top:-2px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--ink);border:3px solid var(--mood,var(--accent));transition:left .12s}
.shead{display:flex;align-items:center;justify-content:space-between;padding:0 10px 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:3px 11px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 6px;scroll-snap-type:x proximity}
.col{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border:0;background:none;border-radius:10px;scroll-snap-align:start}
.col.d{width:56px}
/* in Days, the ten columns line up under the date slider and work like it: drag across to move through time, tap for a day */
.row[data-tab="days"]{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:0;overflow:visible;padding:0 16px;touch-action:none;scroll-snap-type:none;cursor:ew-resize;-webkit-user-select:none;user-select:none}
.row[data-tab="days"] .col{width:auto;padding:4px 0 3px;border-radius:8px}
.row[data-tab="days"] .col svg{width:19px;height:19px}
.row[data-tab="days"] .col .v{font-size:12.5px}
.row[data-tab="days"] .col .lo{font-size:10.5px}
/* Hours: two pages of 12, no scrolling. Swipe or tap the dots to change page, tap an hour to pick it */
.row[data-tab="hours"]{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0;overflow:hidden;padding:0 8px;scroll-snap-type:none;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.row[data-tab="hours"] .col{width:auto;padding:4px 0}
.row[data-tab="hours"] .col .t{font-size:10px;letter-spacing:-.02em}
.row[data-tab="hours"] .col .v{font-size:12px;letter-spacing:-.03em}
.row[data-tab="hours"] .col .p{font-size:9.5px}
.row.sl-l .col{animation:slL .28s cubic-bezier(.2,.8,.2,1)}
.row.sl-r .col{animation:slR .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slL{from{transform:translateX(34px);opacity:0}to{transform:none;opacity:1}}
@keyframes slR{from{transform:translateX(-34px);opacity:0}to{transform:none;opacity:1}}
.pgdots{display:inline-flex;margin-left:8px;vertical-align:middle;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.pgdots[hidden]{display:none}
.pgdots button{border:0;background:none;padding:2px 9px;font-size:11px;font-weight:600;letter-spacing:.04em}
.pgdots button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.row[data-tab="hours"] .col:disabled{opacity:.3;cursor:default}
@media (prefers-reduced-motion:reduce){.row .col{animation:none!important}}
.col .t{font-size:10.5px;color:var(--muted)}
.col svg{width:20px;height:20px}
.col .v{font-family:var(--f-mono);font-size:13px}
.col .p{font-family:var(--f-mono);font-size:10px;color:var(--accent);height:13px}
.col .lo{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.col.sel{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.col.now .t{color:var(--accent);font-weight:600}

/* metric dock */
.dock{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px 4px;margin-top:8px;padding-top:6px;border-top:1px solid var(--ink);border-top-color:color-mix(in srgb,var(--ink) 18%,transparent)}
.dock .m{grid-column:span 3}.dock .m.w{grid-column:span 4}
.m{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;height:40px;padding:0 6px;border:0;background:none;border-radius:10px;text-align:left;cursor:pointer;transition:transform .15s,background .15s}
.m:active{transform:scale(.96)}
.m .label{font-size:9px;letter-spacing:.06em;white-space:nowrap}
.m .val{font-family:var(--f-mono);font-size:16px;white-space:nowrap;overflow:hidden;max-width:100%}
.m .val small{font-size:10px;color:var(--muted);margin-left:1px}
.m.on{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.m.pop{animation:pop .5s ease}
.foot{flex:none;font-size:10.5px;color:var(--muted);text-align:center;margin:0}
.foot a{color:var(--muted)}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:520px;margin:0 auto;max-height:66%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px;flex:none}
.shd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.shd h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px}
.sbody{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding-top:8px}
.big{font-family:var(--f-display);font-weight:500;font-size:44px;line-height:1}
.big small{font-family:var(--f-body);font-size:15px;color:var(--muted);margin-left:4px}
.note{color:var(--muted);font-size:13.5px;margin:0}
.chart{touch-action:pan-y}
.chart svg{display:block;width:100%}
.chart text{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.compass{width:20px;height:20px;vertical-align:-3px;margin-left:4px}
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:64px}
.bars button{border:0;padding:0;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
.bars button.zero{background:var(--line);opacity:1}
.bars button.on{outline:2px solid var(--ink);outline-offset:1px}
.ticks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-size:10.5px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sunsvg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:ew-resize}
.sunrow{display:flex;justify-content:space-between;font-size:13px}
.alert{border-radius:12px;padding:10px 12px}
.alert.severe{background:var(--danger-bg);color:var(--danger-ink)}
.alert.moderate{background:var(--warn-bg);color:var(--warn-ink)}
.alert.minor{background:var(--info-bg);color:var(--info-ink)}
.alert b{display:block}
.alert p{margin:6px 0 0;font-size:12.5px;white-space:pre-line}
.search input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px}
.results button,.places button.pl{width:100%;text-align:left;border:0;background:none;padding:9px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.results small{color:var(--muted)}
.places .row2{display:flex;align-items:center;gap:6px}
.places .row2 button.x{border:0;background:none;color:var(--muted);padding:6px 8px;flex:none}
.places button.pl.on b{color:var(--accent)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
select{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:60%}
.msg{font-size:12.5px;color:var(--muted);margin:0}
.skeleton{opacity:.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <button class="city" id="cityBtn" type="button" aria-label="Places and settings"><b id="pname">New York</b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="pill alert" id="alertPill" type="button" hidden></button>
    <button class="pill sample" id="samplePill" type="button" hidden>Sample</button>
    <span class="grow"></span>
    <span class="label mono" id="updated"></span>
    <button class="ibtn" id="refresh" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </header>

  <section class="cell hero" id="hero" aria-live="polite">
    <div class="when"><span class="tag" id="whenTag">Now</span><button type="button" id="backNow" hidden>Back to now</button></div>
    <canvas class="fx back" id="fxb" aria-hidden="true"></canvas>
    <canvas class="fx front" id="fxf" aria-hidden="true"></canvas>
    <div class="hrow">
      <div class="t3d"><div class="tilt"><div class="anim"><div class="temp" id="temp" aria-label="Temperature">--<sup>°</sup></div></div></div></div>
      <div class="cside">
        <div class="t3d"><div class="tilt"><div class="anim"><div class="hicon" id="hicon"></div></div></div></div>
        <div class="t3d" style="max-width:100%"><div class="tilt"><div class="anim"><div class="cond" id="cond">Loading</div></div></div></div>
      </div>
    </div>
    <div class="hfoot">
      <div class="hinfo"><div class="meta" id="hmeta"></div><div class="meta lnk" id="hrain" data-sheet="rain" role="button" tabindex="0"></div></div>
      <button type="button" class="morebtn" id="moreBtn" aria-expanded="false" aria-controls="more"><span>See more</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="more" id="more" inert><div class="clip"><nav class="dock" id="dock" aria-label="More details"></nav></div></div>
  </section>

  <section class="cell field" id="fieldCard">
    <div class="fhead">
      <div class="mchips" id="mchips" role="group" aria-label="Block height shows"></div>
      <button class="ibtn sm" id="reroll" type="button" aria-label="Reroll the field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg></button>
    </div>
    <div class="stage" id="stage" aria-label="3D chart of the next 10 days, one block per hour. Drag to turn, tap a block."><div class="fread" id="fread" aria-live="polite"></div></div>
  </section>

  <section class="cell strip">
    <div class="shead">
      <div class="seg" role="group" aria-label="Show"><button type="button" id="tabH" aria-pressed="true">Hours</button><button type="button" id="tabD" aria-pressed="false">Days</button></div>
      <span><span class="label" id="slabel">Next 24 hours</span><span class="pgdots" id="pgdots" role="group" aria-label="Page"><button type="button" data-pg="0" aria-label="Morning, midnight to 11am">AM</button><button type="button" data-pg="1" aria-label="Afternoon and evening, noon to 11pm">PM</button></span></span>
    </div>
    <div class="dslider" id="dslider" role="slider" tabindex="0" hidden aria-label="Choose a day in the next 10 days"><div class="rail"></div><div class="fill" id="dfill"></div><div id="dmarks"></div><div class="knob" id="dknob"></div></div>
    <div class="row" id="row"></div>
  </section>

  <p class="foot">Data <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0) · US alerts <a href="https://www.weather.gov/" target="_blank" rel="noopener">NWS</a></p>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle" aria-hidden="true">
  <div class="grab" id="grab"></div>
  <div class="shd" id="shd"><h2 id="stitle">Details</h2><button class="ibtn" id="sclose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sbody" id="sbody"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.IsobarField=(function(){
  if(!window.THREE)return null;
  const stage=document.getElementById("stage");
  if(!stage)return null;
  let renderer;
  try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){return null}
  if(!renderer.getContext())return null;
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  stage.appendChild(renderer.domElement);

  const COLS=24,ROWS=10,N=COLS*ROWS,PX=1.35; // PX: columns are spaced wider than rows, so the field runs long
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(30,1,.1,300);
  const hemi=new THREE.HemisphereLight(0xffffff,0x808890,.9);scene.add(hemi);
  const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(-14,26,16);scene.add(sun);
  const flash=new THREE.PointLight(0xffffff,0,80);flash.position.set(0,18,0);scene.add(flash);

  const geo=new THREE.BoxGeometry(1,1,1);geo.translate(0,.5,0);
  const mat=new THREE.MeshStandardMaterial({roughness:.62,metalness:0});
  const mesh=new THREE.InstancedMesh(geo,mat,N);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  /* a see-through twin: days in front of the selected day move here at 20% opacity, so the rows in front
     are carved away and the selected day and the days behind it stay visible */
  const ghostMat=new THREE.MeshStandardMaterial({roughness:.62,metalness:0,transparent:true,opacity:.2,depthWrite:false});
  const ghost=new THREE.InstancedMesh(geo,ghostMat,N);
  ghost.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const HIDE=new THREE.Matrix4().makeScale(1e-6,1e-6,1e-6);
  {const c0=new THREE.Color(0x8a969d);for(let i=0;i<N;i++){mesh.setColorAt(i,c0);ghost.setColorAt(i,c0);ghost.setMatrixAt(i,HIDE)}}
  scene.add(mesh);scene.add(ghost);
  const floorMat=new THREE.MeshBasicMaterial({transparent:true,opacity:.6});
  const FW=COLS*PX+1.2,FD=ROWS+1.2;
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(FW,FD),floorMat);
  floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);
  const nowMat=new THREE.MeshBasicMaterial();
  const nowMark=new THREE.Mesh(new THREE.PlaneGeometry(PX*.95+.2,1.14),nowMat);
  nowMark.rotation.x=-Math.PI/2;nowMark.position.y=-.01;scene.add(nowMark);

  const X=i=>((i%COLS)-(COLS-1)/2)*PX;
  const Z=i=>(ROWS-1)/2-Math.floor(i/COLS); // today at the front
  const h=new Float32Array(N).fill(.05),tgt=new Float32Array(N).fill(.05),vel=new Float32Array(N);
  const wake=new Float32Array(N),flipAt=new Float32Array(N).fill(-1),phase=new Float32Array(N),rainAmt=new Float32Array(N);
  for(let i=0;i<N;i++)phase[i]=Math.random()*Math.PI*2;
  const dummy=new THREE.Object3D(),col=new THREE.Color(),c2=new THREE.Color();

  let data=null,mode="temp",count=0,nowIdx=-1,sel=-1,focusDay=-1;
  let wind={speed:0,toward:0},rainNow=0,storm=false,F=true,first=true;
  /* camera: rotation is held to 20 degrees either side of the starting view, left/right and up/down */
  const YAW0=-.3,ELEV0=.55,LIM=20*Math.PI/180;
  const YMIN=YAW0-LIM,YMAX=YAW0+LIM,EMIN=ELEV0-LIM,EMAX=ELEV0+LIM;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const soft=(v,a,b)=>v<a?a-Math.min(.07,(a-v)*.25):v>b?b+Math.min(.07,(v-b)*.25):v; // rubber band past the limits while dragging
  let yaw=YAW0,elev=ELEV0,yawT=yaw,elevT=elev,dist=40,distT=40,offX=0,offY=0,offXT=0,offYT=0,fitH=5;
  let swayAmt=reduce?0:1,swayHold=0;
  const api={onSelect:null};

  function tok(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()||"#888888"}
  function C(name){return new THREE.Color(tok(name))}

  const MODES={
    temp:{k:"temperature_2m",ramp:"temp"},feels:{k:"apparent_temperature",ramp:"temp"},
    rain:{k:"precipitation_probability",lo:0,hi:100,to:"--cool"},wind:{k:"wind_speed_10m",lo:0,hiMin:[25,40],to:"--wind"},
    humidity:{k:"relative_humidity_2m",lo:0,hi:100,to:"--cool"},uv:{k:"uv_index",lo:0,hi:11,to:"--warm"},
    cloud:{k:"cloud_cover",lo:0,hi:100,to:"--muted"},pressure:{k:"pressure_msl",to:"--accent"},
    visibility:{k:"visibility",lo:0,to:"--accent"},
    swell:{k:"swell_wave_height",lo:0,hiMin:[8,2.5],to:"--sea"},
    tide:{k:"sea_level_height_msl",to:"--sea"}
  };
  function values(){
    const H=data.hourly,arr=H[(MODES[mode]||MODES.temp).k]||[],v=new Array(count);
    for(let i=0;i<count;i++)v[i]=arr[i]==null?null:arr[i];
    return v;
  }
  function norm(){
    const m=MODES[mode]||MODES.temp,v=values();
    let lo=Infinity,hi=-Infinity;v.forEach(x=>{if(x!=null){lo=Math.min(lo,x);hi=Math.max(hi,x)}});
    if(m.lo!=null)lo=m.lo;
    if(m.hi!=null)hi=m.hi;
    if(m.hiMin)hi=Math.max(hi,m.hiMin[F?0:1]);
    return {m,v,f:x=>x==null?null:Math.max(0,Math.min(1,(x-lo)/((hi-lo)||1)))};
  }
  function computeTargets(){
    if(!data)return;
    const {m,v,f}=norm();
    for(let i=0;i<N;i++){
      const n=i<count?f(v[i]):null;
      tgt[i]=n==null?.05:(m.ramp?.35+n*4.4:.1+n*4.6);
      const p=i<count?(data.hourly.precipitation_probability[i]||0):0;
      rainAmt[i]=p>=40?(p-40)/60:0;
    }
    let mx=0;for(let i=0;i<count;i++)mx=Math.max(mx,tgt[i]);fitH=Math.max(1.5,mx+.35);
  }
  function recolor(){
    if(!data)return;
    const cool=C("--cool"),mid=C("--mid"),warm=C("--warm"),line=C("--line"),bg=C("--surface"),ink=C("--ink"),acc=C("--accent");
    floorMat.color.copy(C("--surface-2"));nowMat.color.copy(acc);
    const {m,v,f}=norm(),to=m.to?C(m.to):null;
    for(let i=0;i<N;i++){
      const n=i<count?f(v[i]):null;
      if(n==null)col.copy(line);
      else if(m.ramp){if(n<.5)col.copy(cool).lerp(mid,n*2);else col.copy(mid).lerp(warm,(n-.5)*2)}
      else col.copy(line).lerp(to,Math.min(1,.15+n));
      if(i<nowIdx)col.lerp(bg,.55);
      if(focusDay>=0&&Math.floor(i/COLS)!==focusDay)col.lerp(bg,.6);
      if(i===sel)col.copy(ink);
      mesh.setColorAt(i,col);ghost.setColorAt(i,col);
    }
    if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
    if(ghost.instanceColor)ghost.instanceColor.needsUpdate=true;
    if(nowIdx>=0){nowMark.visible=true;nowMark.position.x=X(nowIdx);nowMark.position.z=Z(nowIdx)}else nowMark.visible=false;
  }
  function wave(kind){
    // kind "rise": everything drops and springs back up in a sweep; "shuffle": random order
    const t0=performance.now()/1000;
    const ox=Math.random()*COLS,oz=Math.random()*ROWS;
    for(let i=0;i<N;i++){
      const dx=(i%COLS)-ox,dz=Math.floor(i/COLS)-oz;
      const delay=kind==="shuffle"?Math.random()*.6:Math.sqrt(dx*dx+dz*dz)*.03;
      wake[i]=t0+(reduce?0:delay);
      if(kind==="rise"||kind==="shuffle"){h[i]=.04;vel[i]=0}
    }
  }

  api.setData=function(d,o){
    data=d;F=o.F;count=Math.min(N,d.hourly.time.length);
    const cur=d.current.time.slice(0,13)+":00";
    nowIdx=d.hourly.time.findIndex(t=>t>=cur);
    const sp=o.windSpeed||0;wind.speed=F?sp:sp/1.609;wind.toward=((o.windDir||0)+180)*Math.PI/180;
    rainNow=o.rainNow||0;storm=o.kind==="storm";
    if(sel>=count)sel=-1;
    computeTargets();recolor();
    if(first){first=false;wave("rise")}
    kick();
  };
  api.setMode=function(m){if(m===mode)return;mode=m;computeTargets();recolor();
    const t0=performance.now()/1000;for(let i=0;i<N;i++)wake[i]=t0+(reduce?0:(i%COLS)*.012+Math.floor(i/COLS)*.02);kick()};
  api.reroll=function(spin){
    wave(spin?"shuffle":"rise");
    if(spin&&!reduce){yawT=YMIN+Math.random()*(YMAX-YMIN);elevT=EMIN+Math.random()*(EMAX-EMIN)}
    kick();
  };
  api.flip=function(){const t0=performance.now()/1000;for(let i=0;i<N;i++)flipAt[i]=reduce?-1:t0+(i%COLS)*.018+Math.floor(i/COLS)*.03;kick()};
  api.select=function(i,silent){
    if(i==null||i<0||i>=count)return;
    if(i!==sel){sel=i;vel[i]+=reduce?0:9}
    if(focusDay>=0&&Math.floor(i/COLS)!==focusDay)focusDay=-1;
    recolor();kick();
    if(!silent&&api.onSelect)api.onSelect(i);
  };
  api.focusDay=function(d){
    if(d<0||d>=ROWS)return;
    focusDay=d;
    const t0=performance.now()/1000;
    for(let k=0;k<COLS;k++){const i=d*COLS+k;wake[i]=t0+(reduce?0:k*.02);vel[i]+=reduce?0:6}
    recolor();kick();
    if(!reduce){elevT=clamp(.5+d*.03,EMIN,EMAX)}
  };
  api.clearFocus=function(){if(focusDay<0)return;focusDay=-1;recolor();kick()};
  api.mode=()=>mode;

  /* ---------- sizing ---------- */
  let SW=1,SH=1;
  function resize(){
    const w=stage.clientWidth,ht=stage.clientHeight;if(!w||!ht)return;
    SW=w;SH=ht;renderer.setSize(w,ht,false);cam.aspect=w/ht;cam.updateProjectionMatrix();
    fit(yaw,elev,true);kick();
  }
  /* frame the field: find the closest camera distance where the whole floor and the tallest blocks fit
     inside the card (leaving room for the readout line), then shift the view so the field sits centered */
  const corner=new THREE.Vector3();
  function bounds(y,e,d){
    cam.position.set(Math.sin(y)*Math.cos(e)*d,Math.sin(e)*d,Math.cos(y)*Math.cos(e)*d);
    cam.lookAt(0,fitH*.35,0);cam.updateMatrixWorld();
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    const add=()=>{corner.project(cam);x0=Math.min(x0,corner.x);x1=Math.max(x1,corner.x);y0=Math.min(y0,corner.y);y1=Math.max(y1,corner.y)};
    for(let k=0;k<4;k++){corner.set(k&1?FW/2:-FW/2,0,k&2?FD/2:-FD/2);add()}
    /* the top of every block (its resting height), at the corner nearest each side of the frame */
    for(let i=0;i<N;i++){const hy=tgt[i]+(i===sel?.25:0)+.05,x=X(i),z=Z(i);
      for(let c=0;c<4;c++){corner.set(x+(c&1?.5:-.5),hy,z+(c&2?.4:-.4));add()}}
    return[x0,x1,y0,y1];
  }
  function fit(y,e,snap){
    if(cam.view&&cam.view.enabled)cam.clearViewOffset();
    const top=1-2*Math.min(46,SH*.26)/SH,bot=-1+2*6/SH,aw=1.94,ah=top-bot;
    let lo=snap?4:distT*.75,hi=snap?400:distT*1.35,b;
    for(let k=0;k<(snap?18:9);k++){const m=(lo+hi)/2;b=bounds(y,e,m);if(b[1]-b[0]<=aw&&b[3]-b[2]<=ah)hi=m;else lo=m}
    b=bounds(y,e,hi);
    distT=hi;offXT=((b[0]+b[1])/2)*SW/2;offYT=((top+bot)/2-(b[2]+b[3])/2)*SH/2;
    if(snap){dist=distT;offX=offXT;offY=offYT}
  }
  if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener("resize",resize);

  /* ---------- pointer: drag to turn, tap to pick ---------- */
  const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
  let down=null;
  stage.addEventListener("pointerdown",e=>{swayHold=performance.now()/1000+2.5;down={x:e.clientX,y:e.clientY,yaw:yawT,elev:elevT,moved:false,id:e.pointerId,type:e.pointerType}});
  stage.addEventListener("pointermove",e=>{
    if(down&&e.pointerId===down.id){
      const dx=e.clientX-down.x,dy=e.clientY-down.y;
      if(Math.abs(dx)+Math.abs(dy)>6&&!down.moved){down.moved=true;try{stage.setPointerCapture(e.pointerId)}catch(_){}}
      if(down.moved){yawT=soft(down.yaw-dx*.006,YMIN,YMAX);elevT=soft(down.elev+dy*.005,EMIN,EMAX);swayHold=performance.now()/1000+2.5;kick()}
      return;
    }
    if(e.pointerType==="mouse"){const i=pick(e);stage.style.cursor=i>=0?"pointer":""}
  });
  function pick(e){
    const r=stage.getBoundingClientRect();
    ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,cam);

/* ---------- weather animation behind and in front of the hero type ----------

  let relax=0;
  const settle=ms=>{clearTimeout(relax);relax=setTimeout(()=>{el.classList.remove("touch");el.style.removeProperty("--ry");el.style.removeProperty("--rx")},ms)};
  const lean=e=>{const rc=el.getBoundingClientRect(),px=(e.clientX-rc.left)/rc.width-.5,py=(e.clientY-rc.top)/rc.height-.5;
    clearTimeout(relax);el.classList.add("touch");el.style.setProperty("--ry",(-16+px*30).toFixed(1)+"deg");el.style.setProperty("--rx",(9-py*18).toFixed(1)+"deg")};
  if(!reduce){
    el.addEventListener("pointermove",lean);el.addEventListener("pointerdown",lean);
    el.addEventListener("pointerleave",()=>settle(350));
    el.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse")settle(500)});
    el.addEventListener("pointercancel",()=>settle(300));
  }
})();
$("#backNow").addEventListener("click",()=>setSel(V.now,"tap"));

/* hours / days strip */
function setTab(t){V.tab=t;$("#tabH").setAttribute("aria-pressed",t==="hours");$("#tabD").setAttribute("aria-pressed",t==="days");$("#row").dataset.tab="";if(V.d)renderStrip()}
$("#tabH").addEventListener("click",()=>setTab("hours"));$("#tabD").addEventListener("click",()=>setTab("days"));
/* a day starts at 8am (today starts now), so its whole row of bars stays in view */
const dayStart=k=>k<=0?V.now:k*24+8;
const pickDay=k=>setSel(dayStart(Math.max(0,Math.min(V.d.daily.time.length-1,k))),"day");
/* the date slider and the day columns scrub the same way: drag to move hour by hour, tap to jump to a day */
function scrubber(el,box,onTap){
  let d=null;
  const frac=e=>{const[l,r]=box();return Math.max(0,Math.min(1,(e.clientX-l)/((r-l)||1)))};
  el.addEventListener("pointerdown",e=>{if(!V.d||V.tab!=="days")return;d={x:e.clientX,id:e.pointerId,moved:false}});
  el.addEventListener("pointermove",e=>{if(!d||e.pointerId!==d.id)return;
    if(!d.moved&&Math.abs(e.clientX-d.x)>5){d.moved=true;el._dragged=true;try{el.setPointerCapture(e.pointerId)}catch(_){}}
    if(d.moved)setSel(Math.round(frac(e)*(V.count-1)),"scrub")});
  el.addEventListener("pointerup",e=>{if(d&&!d.moved&&onTap)onTap(Math.floor(frac(e)*V.d.daily.time.length));d=null});
  el.addEventListener("pointercancel",()=>{d=null});
}
{const ds=$("#dslider");
 scrubber(ds,()=>{const rc=ds.getBoundingClientRect();return[rc.left,rc.right]},pickDay);
 ds.addEventListener("keydown",e=>{const st={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(st){e.preventDefault();pickDay(dayOf(V.sel)+st)}})}
{const row=$("#row");
 scrubber(row,()=>{const c=row.querySelectorAll(".col.d");if(!c.length){const rc=row.getBoundingClientRect();return[rc.left,rc.right]}return[c[0].getBoundingClientRect().left,c[c.length-1].getBoundingClientRect().right]},null)}
function setPage(n,dirHint){if(!V.d||V.tab!=="hours")return;n=Math.max(0,Math.min(1,n));if(n===V.page)return;V.slide=n>V.page?"sl-l":"sl-r";V.page=n;renderStrip("page")}
$("#pgdots").addEventListener("click",e=>{const b=e.target.closest("button[data-pg]");if(b)setPage(+b.dataset.pg)});
{const row=$("#row");let sw=null;
 row.addEventListener("pointerdown",e=>{row._dragged=false;if(V.tab==="hours")sw={x:e.clientX,y:e.clientY}});
 row.addEventListener("pointerup",e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
   if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy)*1.3){row._dragged=true;setPage(V.page+(dx<0?1:-1))}});
 row.addEventListener("pointercancel",()=>{sw=null})}
$("#row").addEventListener("click",e=>{const b=e.target.closest(".col");if(!b)return;
  if(b.dataset.i!=null)setSel(+b.dataset.i,"strip");
  else{const r=$("#row");if(r._dragged){r._dragged=false;return}pickDay(+b.dataset.day)}});

/* dock and sheet */
$("#dock").addEventListener("click",e=>{const b=e.target.closest(".m");if(b)openSheet(b.dataset.id)});
$("#moreBtn").addEventListener("click",()=>setMore(!$("#more").classList.contains("open")));
for(const host of["#hero","#fread"])$(host).addEventListener("click",e=>{const b=e.target.closest("[data-sheet]");if(b)openSheet(b.dataset.sheet)});
$("#fread").addEventListener("pointerdown",e=>{if(e.target.closest(".lnk"))e.stopPropagation()}); // a tap on the wind link isn't a tap on the bars behind it
$("#hrain").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openSheet("rain")}});
$("#cityBtn").addEventListener("click",()=>openSheet("places"));
$("#alertPill").addEventListener("click",()=>openSheet("alerts"));
$("#samplePill").addEventListener("click",()=>{openSheet("places");showMsg("The weather service couldn't be reached from here, so this is sample data. On your hosted copy, tap refresh.")});
$("#scrim").addEventListener("click",closeSheet);$("#sclose").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&V.sheet)closeSheet()});
/* swipe the sheet's top edge down to close */
(function(){let y0=null;
  ["#grab","#shd"].forEach(s=>$(s).addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;y0=e.clientY}));
  window.addEventListener("pointerup",e=>{if(y0!=null&&e.clientY-y0>50)closeSheet();y0=null});
})();
/* everything inside the sheet */
$("#sbody").addEventListener("click",e=>{
  const pl=e.target.closest("button.pl[data-i]");if(pl){S.active=+pl.dataset.i;save();load();closeSheet();return}
  const rm=e.target.closest("button[data-rm]");if(rm){const i=+rm.dataset.rm;S.places.splice(i,1);if(S.active>=i&&S.active>0)S.active--;save();load();renderSheet();return}
  const g=e.target.closest("button[data-g]");if(g){const x=V.results[+g.dataset.g];const np={name:x.name,admin:x.admin1||"",cc:x.country_code||"",lat:x.latitude,lon:x.longitude};
    const ex=S.places.findIndex(p=>Math.abs(p.lat-np.lat)<.01&&Math.abs(p.lon-np.lon)<.01);if(ex>=0)S.active=ex;else{S.places.push(np);S.active=S.places.length-1}save();load();closeSheet();return}
  if(e.target.closest("#locate")){locate();return}
  const u=e.target.closest("button[data-u]");if(u){setUnits(u.dataset.u);renderSheet();return}
  const nb=e.target.closest("#nbars button");if(nb){const k=+nb.dataset.k;document.querySelectorAll("#nbars button").forEach(x=>x.classList.toggle("on",x===nb));$("#snote").textContent=nowcastSay(k)}
});
$("#sbody").addEventListener("change",e=>{if(e.target.id==="model"){S.model=e.target.value;store.set("isobar.model",S.model);if(Field)Field.reroll(true);load()}});
let qt;
$("#sbody").addEventListener("input",e=>{if(e.target.id!=="q")return;clearTimeout(qt);const v=e.target.value.trim();const res=$("#results");if(v.length<2){res.innerHTML="";return}
  qt=setTimeout(async()=>{try{const j=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=6&language=en&format=json`,6000);
    V.results=j.results||[];res.innerHTML=V.results.length?V.results.map((x,i)=>`<button type="button" data-g="${i}"><span>${esc(x.name)}</span><small>${esc([x.admin1,x.country].filter(Boolean).join(", "))}</small></button>`).join(""):'<p class="msg">No places found. Check the spelling.</p>'}
  catch(err){res.innerHTML='<p class="msg">Search isn\'t reachable from here.</p>'}},300)});
/* chart and sun scrubbing inside the sheet */
(function(){
  let d=null;
  const idxFrom=(x,el)=>{
    if(el.id==="schart"){const rc=el.getBoundingClientRect(),W=+el.dataset.w,pl=+el.dataset.pl,cw=+el.dataset.cw;const px=(x-rc.left)/rc.width*W;return +el.dataset.ws+Math.max(0,Math.min(23,Math.floor((px-pl)/cw)))}
    const rc=el.getBoundingClientRect();const hh=Math.max(0,Math.min(23,Math.round(((x-rc.left)/rc.width*320-14)/(320-28)*24)));return dayOf(V.sel)*24+hh};
  const body=$("#sbody");
  body.addEventListener("pointerdown",e=>{const t=e.target.closest("#schart,#sunsvg");if(!t)return;d={x:e.clientX,moved:false,el:t}});
  body.addEventListener("pointermove",e=>{if(!d)return;if(!d.moved&&Math.abs(e.clientX-d.x)>6){d.moved=true;try{d.el.setPointerCapture(e.pointerId)}catch(_){}}
    if(d.moved&&d.el.isConnected)setSel(idxFrom(e.clientX,d.el),"chart")});
  body.addEventListener("pointerup",e=>{if(d&&!d.moved&&d.el.isConnected)setSel(idxFrom(e.clientX,d.el),"chart");d=null});
  body.addEventListener("pointercancel",()=>{d=null});
})();

/* ---------- loading ---------- */
let loadId=0,lastPlaceKey=null;
async function load(force){
  const id=++loadId,p=place();
  const pk=p.lat.toFixed(3)+","+p.lon.toFixed(3);
  if(Field&&lastPlaceKey&&pk!==lastPlaceKey)Field.reroll();
  lastPlaceKey=pk;
  $("#pname").textContent=p.name;$("#hero").classList.add("skeleton");
  const key=`isobar.cache3.${pk}.${S.units}.${S.model}`;
  const cached=store.get(key,null);
  const apply=(d,aq,al,sample)=>{V.d=d;V.aq=aq;V.al=al||[];V.sample=sample;$("#hero").classList.remove("skeleton");renderForecast()};
  if(cached&&!force&&Date.now()-cached.at<10*60e3){apply(cached.d,cached.aq,cached.al,false);return}
  const aqURL=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}&current=us_aqi,pm2_5,pm10,ozone,nitrogen_dioxide&timezone=auto`;
  const alURL=`https://api.weather.gov/alerts/active?point=${p.lat.toFixed(4)},${p.lon.toFixed(4)}`;
  const [fr,ar,lr,mr]=await Promise.allSettled([getJSON(forecastURL(p)),getJSON(aqURL),(!p.cc||p.cc==="US")?getJSON(alURL):Promise.resolve(null),getJSON(marineURL(p))]);
  if(id!==loadId)return;
  const aq=ar.status==="fulfilled"?ar.value:null;
  const al=lr.status==="fulfilled"&&lr.value&&lr.value.features?lr.value.features.map(f=>f.properties):[];
  if(fr.status==="fulfilled"&&fr.value&&fr.value.current&&fr.value.hourly){mergeSwell(fr.value,mr.status==="fulfilled"?mr.value:null);apply(fr.value,aq,al,false);store.set(key,{at:Date.now(),d:fr.value,aq,al})}
  else if(cached){apply(cached.d,cached.aq,cached.al,false)}
  else apply(sampleData(),null,[],true);
}
function showMsg(t){const m=$("#msg");if(!m)return;m.textContent=t;m.hidden=!t}
function save(){store.set("isobar.places",S.places);store.set("isobar.active",S.active)}
function locate(){
  if(!navigator.geolocation){showMsg("Location isn't available here. Search for a city instead.");return}
  navigator.geolocation.getCurrentPosition(pos=>{const np={name:"Current location",admin:"",cc:"",lat:pos.coords.latitude,lon:pos.coords.longitude};
    const ex=S.places.findIndex(p=>p.name==="Current location");if(ex>=0){S.places[ex]=np;S.active=ex}else{S.places.unshift(np);S.active=0}save();load(true);closeSheet()},
    ()=>showMsg("Location isn't available here. Search for a city instead."),{timeout:8000,maximumAge:600000})}
function setUnits(u){if(u===S.units)return;if(Field)Field.flip();S.units=u;store.set("isobar.units",u);load()}
$("#refresh").addEventListener("click",()=>load(true));

/* ---------- field chips and linking ---------- */
$("#mchips").innerHTML=FMODES.map(([k,l])=>`<button type="button" data-m="${k}" aria-pressed="${k===fmode}">${l}</button>`).join("");
$("#mchips").addEventListener("click",e=>{const b=e.target.closest("button[data-m]");if(b)setFieldMode(b.dataset.m)});
$("#reroll").addEventListener("click",()=>{if(Field)Field.reroll(true)});
if(Field)Field.onSelect=i=>setSel(i,"field");

buildDock();
let rzT;window.addEventListener("resize",()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(V.sheet)renderSheet(true)},150)});
load();
})();
